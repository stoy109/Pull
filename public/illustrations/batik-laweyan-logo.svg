    <path d="M-8 126c34-28 48-14 70-35 18-17 23-43 47-55 18-10 37-7 58 4" fill="none" stroke="#efb35a" stroke-width="8" opacity=".75"/>
    <path d="M-5 134c38-25 52-10 75-32 19-18 22-43 46-55 16-8 32-7 48-1" fill="none" stroke="#5c2b15" stroke-width="4"/>
    <rect width="160" height="160" fill="url(#shade)"/>
  </g>
</svg>
